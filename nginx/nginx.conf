worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream monitor_api {
        server monitor:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Proxy everything to the FastAPI server
        location / {
            proxy_pass         http://monitor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Rate-limit API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://monitor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Direct Ollama access from localhost only (for model management)
        location /ollama/ {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://ollama:11434/;
        }
    }

    # Uncomment and configure for HTTPS:
    # server {
    #     listen 443 ssl;
    #     server_name your-ec2-hostname.compute.amazonaws.com;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     location / {
    #         proxy_pass http://monitor_api;
    #         ...
    #     }
    # }
}
