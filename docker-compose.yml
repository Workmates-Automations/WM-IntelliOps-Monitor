version: '3.9'

services:

  # ── Ollama — local LLM ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: intelliops-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

  # ── Monitor API ───────────────────────────────────────────────────────────────
  monitor:
    build: ./monitor_server
    container_name: intelliops-monitor
    environment:
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - HOME_ACCOUNT_ID=${HOME_ACCOUNT_ID:-036160411876}
      - CROSS_ACCOUNT_ROLE_NAME=${CROSS_ACCOUNT_ROLE_NAME:-CWMSessionRole}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - MONITOR_LAMBDAS=${MONITOR_LAMBDAS:-}
      - MONITOR_DYNAMO_TABLES=${MONITOR_DYNAMO_TABLES:-IntelliOps-Tickets,IntelliOps-Alarms,IntelliOps-Sessions}
      - INTELLIOPS_STRANDS_JOBS_BUCKET=${INTELLIOPS_STRANDS_JOBS_BUCKET:-intelliops-websiterca}
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Certbot — Let's Encrypt renewal daemon ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: intelliops-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot 2>/dev/null; sleep 12h & wait $${!}; done'
    depends_on:
      - nginx
    restart: unless-stopped

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: intelliops-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/init-cert.sh:/docker-entrypoint.d/10-init-cert.sh
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      monitor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  certbot_certs:
  certbot_www:
